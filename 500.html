{% extends "base.html" %}
{% block content %}
<div class="card card-dark">
  <div class="card-body">
    <h1 class="h4 mb-2">Server error (500)</h1>
    <p class="soft mb-3">Something went wrong. Please try again.</p>
    <div class="d-flex gap-2">
      {% if is_authenticated %}
        <a class="btn btn-accent" href="{{ url_for('user_dashboard') }}">
          <i class="bi bi-speedometer2 me-1"></i> Back to Dashboard
        </a>
      {% else %}
        <a class="btn btn-accent" href="{{ url_for('login') }}">
          <i class="bi bi-box-arrow-in-right me-1"></i> Login
        </a>
      {% endif %}
      <a class="btn btn-outline-light" href="{{ url_for('index') }}">
        <i class="bi bi-house me-1"></i> Home
      </a>
    </div>
  </div>
</div>
{% endblock %}
